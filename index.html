<DOCTYPE htmlhtml
<html 语言="zh-CN">
<头部>
    <元数据 字符集="UTF-8">
    <元数据 名称="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        header h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        header p {
            color: #888;
            font-size: 14px;
        }
        .admin-btn{
            position:absolute;
            right:10px;
            top:0;
            padding:6px 12px;
            border:1px solid #ccc;
            border-radius:8px;
            background:#fff;
            光标:指针;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 22px 20px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.25s ease;
<!DOCTYPE html>DOCTYPE: block;
        }

htmlcard:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 13px;
            color: #999;
            line-height: 1.4;
            word-break: break-all;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: #bbb;
            font-size: 12px;
        }
:#fff;/* 后台面板样式 */
        .admin-panel{
            display:none;
            background:#fff;
            padding:20px;
            border-radius:12px;
            margin-bottom:30px;
        }
        .admin-panel textarea{
            width:100%;
            height:320px;
            padding:12px;
            margin:10px 0;
            font-family:monospace;
        }
        .admin-panel input{
easepadding:8px;
            width:220px;
        }
        .admin-panel button{
            padding:8px 16px;
            margin:4px;
            cursor:pointer;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 16px;
            }
            header h1 {
                font-size: 26px;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .card {
                padding: 18px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>我的导航</h1>
            <p>常用站点一键直达</p>
            <button class="admin-btn" onclick="openAdmin()">管理</button>
        </header>

        <!-- 后台管理面板 -->
        <div class="admin-panel" id="adminBox">
            <h3>后台编辑（格式：#网站名|链接）</h3>
            <p>一行一条，示例：<br>#Github|https://github.com<br>#B站|https://bilibili.com</p>
            <input type="password" id="adminPwd" placeholder="输入管理密码">
            <textarea id="linkText"></textarea>
            <br>
            <button onclick="loadLinks()">读取现有</button>
            <button onclick="saveLinks()">保存</button>
            <span id="msg"></span>
        </div>

        <div class="grid" id="linkGrid"></div>

        <footer>
            © My Links · Powered by Cloudflare
        </footer>
    </div>

    <script>
        // ========= 替换成你的Worker域名！！========
        const WORKER_API = "gaohang.zjbcc.cc.cd";
        // ======================================
        const grid = document.getElementById("linkGrid");

        // 打开后台面板
        function openAdmin(){
            const box = document.getElementById("adminBox");
            box.style.display = box.style.display === "block" ? "none" : "block";
        }

        // 从KV读取文本
        async function loadLinks(){
            const res = await fetch(`${WORKER_API}/api/get`);
            const txt = await res.text();
            document.getElementById("linkText").value = txt;
            document.getElementById("msg").innerText="已加载";
        }

        // 保存到KV
        async function saveLinks(){
            const pwd = document.getElementById("adminPwd").value;
            const content = document.getElementById("linkText").value;
            const resp = await fetch(`${WORKER_API}/api/save`,{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({pwd, content})
            });
            const ret = await resp.text();
            document.getElementById("msg").innerText = ret;
            // 保存成功自动刷新卡片
            if(ret === "ok"){
                renderCards(content);
            }
        }

        // 解析文本渲染卡片（#名称|url 一行一条）
        function renderCards(text){
            grid.innerHTML="";
            const lines = text.split("\n");
            lines.forEach(line=>{
                const l = line.trim();
                if(!l || !l.startsWith("#")) return;
                const [name, url] = l.replace("#","").split("|");
                if(!name || !url) return;
                // 卡片渲染，沿用你原来样式
                const a = document.createElement("a");
                a.className = "card";
                a.href = url.trim();
                a.target = "_blank";
                a.rel = "noopener noreferrer";

                const title = document.createElement("div");
                title.className = "card-title";
                title.textContent = name.trim();

                const desc = document.createElement("div");
                desc.className = "card-desc";
                desc.textContent = url.trim();

                a.appendChild(title);
                a.appendChild(desc);
                grid.appendChild(a);
            })
        }

        // 页面加载自动读取链接渲染
        (async ()=>{
            const res = await fetch(`${WORKER_API}/api/get`);
            const raw = await res.text();
            renderCards(raw);
        })()
    </script>
</body>
</html>
