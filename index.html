<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的导航站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        header p {
            color: #888;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 22px 20px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.25s ease;
            display: block;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 13px;
            color: #999;
            line-height: 1.4;
            word-break: break-all;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: #bbb;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 16px;
            }
            header h1 {
                font-size: 26px;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .card {
                padding: 18px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>我的导航</h1>
            <p>常用站点一键直达</p>
        </header>

        <div class="grid" id="linkGrid"></div>

        <footer>
            © 2025 My Links · Powered by Cloudflare
        </footer>
    </div>

    <script>
        // ========== 在这里添加/删除链接，格式：名称, 地址, 描述 ==========
        const links = [
            { name: "Google", url: "https://www.google.com", desc: "搜索引擎" },
            { name: "GitHub", url: "https://github.com", desc: "代码托管" },
            { name: "知乎", url: "https://www.zhihu.com", desc: "问答社区" },
            { name: "B站", url: "https://www.bilibili.com", desc: "视频平台" },
            { name: "Cloudflare", url: "https://www.cloudflare.com", desc: "CDN服务" },
            { name: "Vercel", url: "https://vercel.com", desc: "前端部署" }
        ];
        // ==============================================================

        const grid = document.getElementById("linkGrid");

        links.forEach(item => {
            const a = document.createElement("a");
            a.className = "card";
            a.href = item.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";

            const title = document.createElement("div");
            title.className = "card-title";
            title.textContent = item.name;

            const desc = document.createElement("div");
            desc.className = "card-desc";
            desc.textContent = item.desc || item.url;

            a.appendChild(title);
            a.appendChild(desc);
            grid.appendChild(a);
        });
    </script>
</body>
</html>
